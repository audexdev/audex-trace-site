<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Audex Trace</title>
  <desc id="desc">Audex Trace is an Apple Music mini player for macOS with playback format detection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset="0.55" stop-color="#101722"/>
      <stop offset="1" stop-color="#07120f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7f2ff"/>
      <stop offset="1" stop-color="#76e0b2"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="220" cy="80" r="320" fill="#77d7ff" opacity="0.14"/>
  <circle cx="980" cy="220" r="290" fill="#76e0b2" opacity="0.1"/>
  <g transform="translate(92 82)">
    <g transform="translate(0 0)">
      <circle cx="35" cy="35" r="34" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
      <path d="M28 48V23h16c8 0 14 5 14 12s-6 13-14 13H28Z" fill="none" stroke="#c7f2ff" stroke-width="4" stroke-linejoin="round"/>
      <path d="M45 48 59 62" stroke="#76e0b2" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="92" y="47" fill="#f6f7f9" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="34" font-weight="700">Audex Trace</text>
  </g>
  <g transform="translate(92 202)">
    <text x="0" y="0" fill="#b9edff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="24" font-weight="750" letter-spacing="3">APPLE MUSIC-FIRST</text>
    <text x="0" y="92" fill="#f6f7f9" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="74" font-weight="760">Trace what is</text>
    <text x="0" y="174" fill="#f6f7f9" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="74" font-weight="760">actually playing.</text>
    <text x="0" y="242" fill="#d7dbe2" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="30">Playback format detection for macOS.</text>
  </g>
  <g transform="translate(750 170)" filter="url(#softShadow)">
    <rect x="0" y="0" width="350" height="222" rx="28" fill="#12161f" opacity="0.92" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="32" y="58" fill="#737d8c" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="760" letter-spacing="2">DETECTED SWITCH</text>
    <text x="32" y="124" fill="#f6f7f9" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="30" font-weight="680">16-bit / 44.1 kHz</text>
    <path d="M34 154h270" stroke="#77d7ff" stroke-width="2" stroke-opacity="0.55"/>
    <text x="32" y="198" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="34" font-weight="760">24-bit / 192 kHz</text>
  </g>
  <g transform="translate(92 548)">
    <rect x="0" y="-34" width="202" height="48" rx="24" fill="#76e0b2" opacity="0.12" stroke="#76e0b2" stroke-opacity="0.26"/>
    <text x="24" y="-3" fill="#c9f4e1" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="700">macOS 15+</text>
    <rect x="224" y="-34" width="260" height="48" rx="24" fill="#77d7ff" opacity="0.1" stroke="#77d7ff" stroke-opacity="0.26"/>
    <text x="248" y="-3" fill="#b9edff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="700">GitHub Releases</text>
  </g>
